name: Job scrape + WhatsApp alerts

# Runs EVERY 30 MINUTES (free on public repos). Each run:
#   - reads your APPLIED / NO THANKS WhatsApp replies
#   - searches Reed + Adzuna + a rotating batch of 4 google-style dorks
#     (full 12-dork sweep every 6 hours)
#   - INSTANTLY WhatsApps you any job not seen before (JOB NAME, PAY,
#     DISTANCE, BUS LINK, WHAT YOU'D DO, COVER LETTER, APPLY LINK)
#   - reminds you once a day about jobs you haven't answered
#   - updates jobs-data.json (site redeploys) + jobs-state.json (your answers)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you click "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape job boards + send WhatsApp alerts
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_GREEN_INSTANCE_ID: ${{ secrets.WHATSAPP_GREEN_INSTANCE_ID }}
          WHATSAPP_GREEN_TOKEN: ${{ secrets.WHATSAPP_GREEN_TOKEN }}
        run: node scraper/nightly-scrape.mjs

      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-data.json jobs-state.json
          if git diff --cached --quiet; then
            echo "No new jobs - nothing to commit."
          else
            git commit -m "job scrape: refresh cards + alert memory"
            git push
          fi
